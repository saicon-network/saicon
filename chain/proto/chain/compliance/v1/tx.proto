syntax = "proto3";
package chain.compliance.v1;

import "amino/amino.proto";
import "chain/compliance/v1/params.proto";
import "chain/compliance/v1/types.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/compliance/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // SubmitEvidence records a non-compliance event against a validator,
  // setting C=0 and triggering quarantine (or jail for critical violations).
  // Authority-gated (defaults to x/gov module account).
  rpc SubmitEvidence(MsgSubmitEvidence) returns (MsgSubmitEvidenceResponse);

  // ClearFlag restores a validator to compliant (C=1), moving it back to
  // active if currently quarantined. Authority-gated.
  rpc ClearFlag(MsgClearFlag) returns (MsgClearFlagResponse);

  // Unjail moves a JAILED validator back to ACTIVE (restoring C=1), subject to
  // a block-based cooldown and an x/slashing tombstone check. Authority-gated
  // (x/gov account).
  rpc Unjail(MsgUnjail) returns (MsgUnjailResponse);
}

// MsgSubmitEvidence flags a validator as non-compliant.
message MsgSubmitEvidence {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "chain/x/compliance/MsgSubmitEvidence";

  // authority must be the module authority (x/gov account).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // validator_address is the operator address being flagged.
  string validator_address = 2;
  // event is the compliance event type (drives quarantine vs jail).
  ComplianceEventType event = 3;
  // reason is a free-text justification recorded in the audit trail.
  string reason = 4;
}

// MsgSubmitEvidenceResponse is the response for SubmitEvidence.
message MsgSubmitEvidenceResponse {}

// MsgClearFlag restores a validator's compliance.
message MsgClearFlag {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "chain/x/compliance/MsgClearFlag";

  // authority must be the module authority (x/gov account).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // validator_address is the operator address being restored.
  string validator_address = 2;
  // reason is a free-text justification recorded in the audit trail.
  string reason = 3;
}

// MsgClearFlagResponse is the response for ClearFlag.
message MsgClearFlagResponse {}

// MsgUnjail restores a JAILED validator to ACTIVE via governance.
message MsgUnjail {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "chain/x/compliance/MsgUnjail";

  // authority must be the module authority (x/gov account).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // validator_address is the operator address being unjailed.
  string validator_address = 2;
  // reason is a free-text justification recorded in the audit trail.
  string reason = 3;
}

// MsgUnjailResponse is the response for Unjail.
message MsgUnjailResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "chain/x/compliance/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}
