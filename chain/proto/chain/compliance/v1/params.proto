syntax = "proto3";
package chain.compliance.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/compliance/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "chain/x/compliance/Params";
  option (gogoproto.equal) = true;

  // unjail_cooldown_blocks is the minimum number of blocks a validator must
  // remain JAILED before a governed MsgUnjail is accepted (measured from
  // last_status_change_height). Gov-tunable via MsgUpdateParams.
  int64 unjail_cooldown_blocks = 1;
}
