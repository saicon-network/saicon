syntax = "proto3";
package chain.compliance.v1;

import "amino/amino.proto";
import "chain/compliance/v1/params.proto";
import "chain/compliance/v1/types.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/compliance/types";

// GenesisState defines the compliance module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // compliance_states is the C flag and its evidence trail for every validator
  // the module knows about.
  //
  // This is the SOURCE OF TRUTH that x/validatorregistry only mirrors, so losing
  // it across an export/import is worse than losing the mirror: the reward gate
  // reads a missing state as innocent (`compliant := !found || state.Compliant`),
  // so a validator sanctioned with C=0 would become reward-eligible again after a
  // routine coordinated restart, and the whole evidence trail — last event, time
  // and reason — would be gone.
  repeated ComplianceState compliance_states = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // offences is every recorded offence, ordered by evidence hash bytes (spec §10).
  // The by-entity index is rebuilt from it on import.
  repeated Offence offences = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // sanctions is every executed sanction, ordered by id.
  repeated Sanction sanctions = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // next_sanction_id is the id the next sanction gets. 0 reads as 1: proto3
  // omits a zero and a hand-written genesis may leave it out. Validate requires
  // it, so read, to be above every sanction id.
  uint64 next_sanction_id = 5;

  // removed_consensus_addresses is every tombstoned consensus address whose
  // validator x/staking removed, bech32, ordered by address bytes. An offence on
  // one of them is never slashed or classified again (spec §8.3).
  repeated string removed_consensus_addresses = 6;
}
