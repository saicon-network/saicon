syntax = "proto3";
package chain.stakeengine.v1;

import "amino/amino.proto";
import "chain/stakeengine/v1/params.proto";
import "chain/stakeengine/v1/types.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/stakeengine/types";

// Query defines the gRPC querier service.
service Query {
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/params";
  }
  rpc Caps(QueryCapsRequest) returns (QueryCapsResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/caps";
  }
  rpc ValidatorCap(QueryValidatorCapRequest) returns (QueryValidatorCapResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/validators/{validator_address}/cap";
  }
  rpc Queue(QueryQueueRequest) returns (QueryQueueResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/queue";
  }
  rpc QueueEntry(QueryQueueEntryRequest) returns (QueryQueueEntryResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/queue/{id}";
  }
  rpc DelegatorQueue(QueryDelegatorQueueRequest) returns (QueryDelegatorQueueResponse) {
    option (google.api.http).get = "/saicon/chain/stakeengine/v1/delegators/{delegator_address}/queue";
  }
}

message QueryParamsRequest {}

message QueryParamsResponse {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // entry_floor is the tier-1 constant, reported so a client need not hard-code it.
  string entry_floor = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryCapsRequest {}

message QueryCapsResponse {
  CapState cap_state = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  string total_bonded = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // headroom is global_cap - total_bonded; negative when the cap fell below what
  // is already bonded.
  string headroom = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryValidatorCapRequest {
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
}

message QueryValidatorCapResponse {
  string tokens = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string validator_cap = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // room is validator_cap - tokens; negative for a validator above its cap.
  string room = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

message QueryQueueRequest {
  // pagination uses offset and limit over the fill order. limit defaults to 100,
  // at most 500.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryQueueResponse {
  // entries in fill order.
  repeated QueueEntry entries = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryQueueEntryRequest {
  uint64 id = 1;
}

message QueryQueueEntryResponse {
  QueueEntry entry = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message QueryDelegatorQueueRequest {
  string delegator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message QueryDelegatorQueueResponse {
  repeated QueueEntry entries = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
