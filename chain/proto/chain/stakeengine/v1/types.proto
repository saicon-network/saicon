syntax = "proto3";
package chain.stakeengine.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/stakeengine/types";

// CapState is the per-epoch snapshot every check during that epoch reads, so a
// check gives the same answer in simulation and in execution.
message CapState {
  // epoch is the epoch these values were computed for (0 at genesis).
  uint64 epoch = 1;
  string public_circulating = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string global_cap = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // ewma_bonded is the smoothed total bonded the per-validator cap is drawn from.
  string ewma_bonded = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string validator_cap = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// QueueEntry is stake waiting for room under the global cap. Its coins are held
// in the stakeengine module account until the entry is filled or cancelled.
message QueueEntry {
  uint64 id = 1;
  string delegator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string validator = 3 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
  // amount is what remains to be filled, in nscn.
  string amount = 4 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  int64 enqueued_height = 5;
}

// HookRecord is what the staking backstop notes before x/staking changes a
// delegation, so the after hook can tell growth from shrinkage. It lives in the
// transient store only and never reaches consensus state.
message HookRecord {
  string tokens = 1 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string bonded = 2 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string self_bond = 3 [(cosmos_proto.scalar) = "cosmos.Int", (gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  bool existed = 4;
  bool is_operator = 5;
}
