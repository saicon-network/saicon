syntax = "proto3";
package chain.stakeengine.v1;

import "amino/amino.proto";
import "chain/stakeengine/v1/params.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/stakeengine/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams updates the module parameters. The authority defaults to x/gov.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // EnqueueDelegation escrows coins and queues them as a delegation to validator,
  // filled in validator-quality order as room opens under the global cap.
  rpc EnqueueDelegation(MsgEnqueueDelegation) returns (MsgEnqueueDelegationResponse);

  // CancelQueuedDelegation returns what remains of a queue entry to its delegator.
  rpc CancelQueuedDelegation(MsgCancelQueuedDelegation) returns (MsgCancelQueuedDelegationResponse);
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "chain/x/stakeengine/MsgUpdateParams";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgUpdateParamsResponse {}

message MsgEnqueueDelegation {
  option (cosmos.msg.v1.signer) = "delegator";
  option (amino.name) = "chain/x/stakeengine/MsgEnqueueDelegation";

  string delegator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string validator = 2 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
  cosmos.base.v1beta1.Coin amount = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

message MsgEnqueueDelegationResponse {
  uint64 id = 1;
}

message MsgCancelQueuedDelegation {
  option (cosmos.msg.v1.signer) = "delegator";
  option (amino.name) = "chain/x/stakeengine/MsgCancelQueuedDelegation";

  string delegator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
}

message MsgCancelQueuedDelegationResponse {
  cosmos.base.v1beta1.Coin returned = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
