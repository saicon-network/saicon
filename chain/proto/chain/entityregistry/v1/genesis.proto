syntax = "proto3";
package chain.entityregistry.v1;

import "amino/amino.proto";
import "chain/entityregistry/v1/params.proto";
import "chain/entityregistry/v1/types.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/entityregistry/types";

// GenesisState is the whole entity registry.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Entity entities = 2 [(gogoproto.nullable) = false];
  repeated Member members = 3 [(gogoproto.nullable) = false];
  repeated FrozenSeat frozen = 4 [(gogoproto.nullable) = false];
  // pending are bonded validators the activation gate held.
  repeated string pending = 5 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
  // vrf_key_offers are keys offered and not yet bound.
  repeated VrfKeyOffer vrf_key_offers = 6 [(gogoproto.nullable) = false];
  // vrf_key_owners is the lifetime index of key to validator.
  repeated VrfKeyOwner vrf_key_owners = 7 [(gogoproto.nullable) = false];
  // departures are the last entity each removed validator left.
  repeated Departure departures = 8 [(gogoproto.nullable) = false];
}
