syntax = "proto3";
package chain.entityregistry.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/entityregistry/types";

// Params of the entity registry (ADR-0014, project decision D-S8-1).
message Params {
  option (amino.name) = "chain/x/entityregistry/Params";
  option (gogoproto.equal) = true;

  // attestors may send MsgAttestEntity and MsgRevokeEntity. Only the gov
  // authority changes this list; the gov authority may also attest and revoke
  // itself, through a proposal. Tier 1 (ADR-0013): at most 10 entries.
  repeated string attestors = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // max_active_seats is how many of one entity's validators may hold registry
  // STATUS_ACTIVE at once. ADR-0014 D2: 2. Bound [1, 3].
  uint32 max_active_seats = 2;
}
