syntax = "proto3";
package chain.rewards.v1;

import "amino/amino.proto";
import "chain/rewards/v1/params.proto";
import "chain/rewards/v1/types.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/saicon-network/saicon/chain/x/rewards/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/saicon/chain/rewards/v1/params";
  }

  // RewardSnapshot returns the reward decision for a validator at an epoch:
  // eligible + minted amount, or ineligible + denial reason.
  rpc RewardSnapshot(QueryRewardSnapshotRequest) returns (QueryRewardSnapshotResponse) {
    option (google.api.http).get = "/saicon/chain/rewards/v1/snapshot/{validator_address}/{epoch_id}";
  }

  // RewardSummary aggregates a validator's emissions over a closed epoch range.
  // The card behind this needs a month at a time; a month is ~5 200 epochs, so
  // the summing happens here rather than over HTTP.
  rpc RewardSummary(QueryRewardSummaryRequest) returns (QueryRewardSummaryResponse) {
    option (google.api.http).get = "/saicon/chain/rewards/v1/summary/{validator_address}/{from_epoch}/{to_epoch}";
  }

  // VotingPowerPreview computes, for every bonded validator, the voting power
  // ADR-0008 §1 would give it from today's state, beside the power CometBFT
  // gives it now. Read-only: it writes nothing and feeds nothing to consensus.
  // Entity caps, seat selection and the lottery are not applied (S10 R12).
  rpc VotingPowerPreview(QueryVotingPowerPreviewRequest) returns (QueryVotingPowerPreviewResponse) {
    option (google.api.http).get = "/saicon/chain/rewards/v1/voting_power_preview";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryRewardSnapshotRequest is request type for the Query/RewardSnapshot RPC method.
message QueryRewardSnapshotRequest {
  string validator_address = 1;
  uint64 epoch_id = 2;
}

// QueryRewardSnapshotResponse is response type for the Query/RewardSnapshot RPC method.
message QueryRewardSnapshotResponse {
  RewardSnapshot snapshot = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryRewardSummaryRequest is the request for Query/RewardSummary. Inclusive on
// both ends, capped.
message QueryRewardSummaryRequest {
  string validator_address = 1;
  uint64 from_epoch = 2;
  uint64 to_epoch = 3;
}

// QueryRewardSummaryResponse is the response for Query/RewardSummary.
//
// epochs_with_record is how many epochs in the range produced a snapshot at all;
// epochs_paid is how many of those were eligible. The difference is the number of
// recorded denials, which is what makes "broke yesterday" distinguishable from
// "never worked".
message QueryRewardSummaryResponse {
  string total_amount = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  string denom = 2;
  uint64 epochs_requested = 3;
  uint64 epochs_with_record = 4;
  uint64 epochs_paid = 5;
}

// QueryVotingPowerPreviewRequest is the request for Query/VotingPowerPreview.
message QueryVotingPowerPreviewRequest {}

// VotingPowerPreviewParams are the inputs the preview applied to every validator.
message VotingPowerPreviewParams {
  // warp_threshold is x/participation's warp_threshold, on 0-100.
  string warp_threshold = 1 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // warp_initial is the WARP used for a validator with no stored WARP.
  string warp_initial = 2 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // validator_cap is x/stakeengine's current per-validator cap, in nscn.
  string validator_cap = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
}

// VotingPowerPreviewEntry is one bonded validator in the preview.
message VotingPowerPreviewEntry {
  string operator_address = 1;
  // bonded is the validator's bonded tokens, in nscn.
  string bonded = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // capped_bonded is min(bonded, validator_cap).
  string capped_bonded = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // warp is the stored WARP, or warp_initial when the validator has none.
  string warp = 4 [
    (cosmos_proto.scalar) = "cosmos.Dec",
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  // warp_measured is true when the stored WARP comes from a scored epoch
  // (its last_epoch > 0). It is false with no stored WARP (warp is then
  // warp_initial) and for a validator punished before its first scored
  // epoch (warp is then its stored 0).
  bool warp_measured = 5;
  // compliant is C = 1, read from x/compliance as the reward gate reads it.
  bool compliant = 6;
  // status is the validator's x/validatorregistry status.
  string status = 7;
  // vp = floor(capped_bonded * warp / 100 * C), in nscn.
  string vp = 8 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // vp_share is vp / total_vp with 6 decimals, truncated; "0" when not eligible.
  string vp_share = 9;
  // stock_power is the validator's CometBFT power today.
  int64 stock_power = 10;
  // stock_share is stock_power / total_stock_power with 6 decimals, truncated.
  string stock_share = 11;
  // eligible is status ACTIVE, C = 1, EP > 0 (the reward gate) and
  // warp >= warp_threshold.
  bool eligible = 12;
  // reason says why a validator is not eligible: "not active",
  // "non-compliant", "EP=0" or "warp below threshold", the first that
  // applies. Empty when eligible.
  string reason = 13;
}

// QueryVotingPowerPreviewResponse is the response for Query/VotingPowerPreview.
// validators are ordered by vp descending, ties by operator_address
// ascending as a string.
message QueryVotingPowerPreviewResponse {
  int64 height = 1;
  // epoch is the last closed epoch, height / epoch_length: the one whose WARP
  // the preview reads. 0 before the first.
  uint64 epoch = 2;
  VotingPowerPreviewParams params = 3 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated VotingPowerPreviewEntry validators = 4 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // total_vp is the sum of vp over eligible validators, the vp_share
  // denominator.
  string total_vp = 5 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // total_stock_power is the sum of stock_power over the bonded set.
  int64 total_stock_power = 6;
}
