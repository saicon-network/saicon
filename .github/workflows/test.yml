name: test

# Also called by the docker and release workflows, which publish nothing unless
# this passes on the same commit.
on: [push, pull_request, workflow_call]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [chain, indexer]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # The VRF again on the generic Go backend: curve25519-voi picks AVX2 assembly on
      # linux/amd64, and purego forces the fallback, so both code paths are tested.
      - name: Test the VRF on purego
        if: matrix.module == 'chain'
        run: go test -tags purego ./crypto/vrf/
